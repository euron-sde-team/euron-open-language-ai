# ─────────────────────────────────────────────────────────────────────────────
# Euron Open Language AI: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base sends mail straight to Mailpit (MAIL_MODE=smtp); the overlays
# switch it to SES (emulated by Floci, or real).
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   web 3640   api 5116   postgres 5562   redis 6499   mailpit 8116 (smtp 1116)
#   floci 4667   stubs 5209
#
# The browser only ever talks to the web app: it proxies /api/* to the API
# (API_INTERNAL_URL), so the refresh cookie is first-party, exactly as behind the load
# balancer on AWS. The API port is published for curl and the integration tools.
#
# Model providers: the stack needs no key at all. The API registers the "Stub"
# provider on first boot (apps/stubs: a deterministic planner and scorer, and a voice
# that speaks with the browser's own speech synthesis while you type or dictate) next
# to the real ones; put PROVIDER_KEYS or OPENAI_API_KEY, GEMINI_API_KEY, ... in .env to
# practice session with real voice models.
# ─────────────────────────────────────────────────────────────────────────────
name: open-language

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation under the variable's own name, so `--env-file .env.aws` (make up-aws)
# and your shell can set it; the overlays then set their own values on top. Precedence,
# highest first: an overlay's `environment:`, your shell, the last --env-file
# (.env.aws for up-aws, then .env), the default below. Keys the base does not set at
# all (SES_CONFIGURATION_SET, ...) also reach the containers through the overlay's
# `env_file:`.
x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  NODE_ENV: development
  TZ: UTC
  PORT: "5116"
  LOG_LEVEL: ${LOG_LEVEL:-${LANG_LOG_LEVEL:-info}}
  PRODUCT_NAME: ${PRODUCT_NAME:-${LANG_PRODUCT_NAME:-Euron Open Language AI}}
  APP_WEB_URL: http://localhost:${LANG_WEB_PORT:-3640}
  # Same origin as the web app: the browser reaches the API through the web proxy.
  PUBLIC_API_URL: http://localhost:${LANG_WEB_PORT:-3640}
  CORS_ORIGINS: http://localhost:${LANG_WEB_PORT:-3640}
  TRUST_PROXY: "1"
  DATABASE_URL: postgres://lang:lang@postgres:5432/lang
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  # Migrations run once, in the `migrate` one-shot, before the API and worker start.
  MIGRATE_ON_BOOT: "false"
  REDIS_URL: redis://redis:6379
  JOBS_MODE: queue
  JWT_SECRET: ${LANG_JWT_SECRET:?run `make env` first}
  REFRESH_SECRET: ${LANG_REFRESH_SECRET:?run `make env` first}
  # 32 random bytes, base64: encrypts stored TOTP secrets. `make env` adds it to an
  # existing .env as well.
  TOTP_ENCRYPTION_KEY: ${LANG_TOTP_ENCRYPTION_KEY:?run `make env` first}
  COOKIE_SECURE: "false"
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  DATA_DIR: /app/data
  MAIL_MODE: ${MAIL_MODE:-smtp}
  MAIL_FROM: ${MAIL_FROM:-${LANG_PRODUCT_NAME:-Euron Open Language AI} <no-reply@language.example.test>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  # Model provider keys (all optional; empty values are ignored). PROVIDER_KEYS is a
  # JSON object keyed by provider slug, e.g. {"openai":"sk-...","anthropic":"sk-ant-..."},
  # and wins over the single-key shortcuts below.
  PROVIDER_KEYS: ${PROVIDER_KEYS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  # Where providers of kind STUB (the "Stub" provider) live.
  STUBS_URL: ${STUBS_URL:-http://stubs:5209}
  # Where realtime credentials are minted. Real OpenAI and Gemini by default; the
  # stubs' fake endpoints are at http://stubs:5209/v1 and http://stubs:5209/gemini/v1alpha.
  OPENAI_REALTIME_URL: ${OPENAI_REALTIME_URL:-https://api.openai.com/v1}
  GEMINI_LIVE_URL: ${GEMINI_LIVE_URL:-https://generativelanguage.googleapis.com/v1alpha}

# api, worker and migrate are one image with three commands. Each carries the same build
# so any of them can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: lang
      POSTGRES_USER: lang
      POSTGRES_PASSWORD: lang
    ports:
      - "127.0.0.1:${LANG_PG_PORT:-5562}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lang -d lang"]
      interval: 3s
      timeout: 3s
      retries: 30

  # BullMQ (planning, scoring, upkeep) and rate limits. A plain container in
  # every local setup; ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${LANG_REDIS_PORT:-6499}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Every mail the stack sends lands here (directly with MAIL_MODE=smtp, or relayed by
  # the emulator's SES with MAIL_MODE=ses). Web UI: http://localhost:8116
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${LANG_MAILPIT_PORT:-8116}:8025"
      # SMTP, for MAIL_MODE=smtp (the integration matrix sends straight to it).
      - "127.0.0.1:${LANG_SMTP_PORT:-1116}:1025"

  # Deterministic stand-ins for the text model providers and the realtime credential
  # endpoints (apps/stubs). GET http://localhost:5209/__/requests lists what the API sent it.
  stubs:
    build:
      context: ../..
      dockerfile: infra/docker/stubs.Dockerfile
    image: open-language-stubs:local
    environment:
      PORT: "5209"
    ports:
      - "127.0.0.1:${LANG_STUB_PORT:-5209}:5209"
    restart: unless-stopped

  # One-shot: apply db/migrations, then exit 0. The API and worker wait for it.
  migrate:
    build: *api-build
    image: open-language-api:local
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: open-language-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${LANG_API_PORT:-5116}:5116"
    volumes:
      - appdata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      stubs:
        condition: service_started
    restart: unless-stopped

  worker:
    build: *api-build
    image: open-language-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      <<: *api-env
    volumes:
      - appdata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    # No HTTP port: the image's /up check does not apply.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:5116
    image: open-language-web:local
    environment:
      # Server side only: where the Next server proxies /api/* (the OpenAI SDP relay included).
      API_INTERNAL_URL: http://api:5116
      # Origins the browser may open realtime voice connections to (CSP connect-src).
      REALTIME_ORIGINS: ${REALTIME_ORIGINS:-wss://generativelanguage.googleapis.com}
      PRODUCT_NAME: ${PRODUCT_NAME:-${LANG_PRODUCT_NAME:-Euron Open Language AI}}
    ports:
      - "127.0.0.1:${LANG_WEB_PORT:-3640}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata:
