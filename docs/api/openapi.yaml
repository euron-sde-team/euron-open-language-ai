openapi: 3.1.0
info:
  title: Euron Open Language AI API
  version: 0.1.0
  description: |
    REST API of Euron Open Language AI. Sign in with POST /api/auth/login to get a short-lived access
    token (send it as `Authorization: Bearer <token>`) and an httpOnly refresh cookie that
    POST /api/auth/refresh rotates. Native apps send `X-Client: native` and get the refresh token
    in the body instead. Live voice runs between the browser and the realtime provider with a
    short-lived credential from POST /api/practice/{id}/live; OpenAI's WebRTC handshake goes
    through POST /api/realtime/openai/calls (docs/api/realtime.md). The typed DTOs are in packages/types.
    Errors are `{ "error": string, "code": string, "details"?: unknown, "requestId": string }`;
    unexpected failures return 500 with a `requestId` and never the underlying message.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:3640
    description: Local stack (make up), through the web app's proxy
  - url: https://{host}
    variables: { host: { default: app.example.com } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "Access token from POST /api/auth/login or /api/auth/refresh." }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string }, requestId: { type: string } }
tags:
  - name: "auth"
    description: "sign-up, sign-in, sessions, email verification, password reset and two-factor. With `X-Client: native` every session is `IssuedNativeSession` (the refresh token in the body, never a cookie) and refresh / logout take `{ refreshToken }` in the body. New passwords are 10 to 128 characters (400 VALIDATION_FAILED naming the field)."
  - name: "users"
    description: "your account, sessions, export and deletion."
  - name: "meta"
    description: "public facts a client reads before anyone signs in."
  - name: "me"
    description: "your profile, progress, usage, voice models and preferences."
  - name: "scenarios"
    description: "the role-plays a learner can pick."
  - name: "practice"
    description: "start, hold and review conversations with the tutor. Every route is owner-scoped."
  - name: "vocab"
    description: "your vocabulary deck."
  - name: "review"
    description: "spaced-repetition review of your deck."
  - name: "realtime"
    description: "the WebRTC handshake relay for OpenAI Realtime."
  - name: "admin"
    description: "the control plane. Admins only (403 FORBIDDEN_ADMIN otherwise). Admins see accounts, usage, practice session metadata and configuration, never anyone's transcripts or lesson reports."
