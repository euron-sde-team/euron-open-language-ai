<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Euron Open Language AI</title>
  <desc id="d">Euron Open Language AI: a self-hosted voice tutor for learning a language. Role-play scenarios, a lesson report with corrections, vocabulary and drills, spaced-repetition review and progress tracking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100E"/>
      <stop offset="1" stop-color="#1F1612"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <g fill="none" stroke="#E8683F" stroke-opacity="0.16" stroke-width="1.2">
      <circle cx="1060" cy="180" r="90"/>
      <circle cx="1060" cy="180" r="150"/>
      <circle cx="1060" cy="180" r="210"/>
      <circle cx="1060" cy="180" r="270"/>
    </g>

    <!-- Mark: a speech bubble with a wave -->
    <g transform="translate(72 70)">
      <rect width="56" height="56" rx="16" fill="#F7F1EC"/>
      <path d="M15 17a3 3 0 0 1 3-3h20a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H27l-7 6v-6h-2a3 3 0 0 1-3-3z" fill="#14100E"/>
      <path d="M21 25.5h2m3-3v6m3-8v10m3-6v2" fill="none" stroke="#E8683F" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <text x="72" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.4" fill="#F7F1EC">Euron Open Language AI</text>
    <text x="74" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#C9BDB4">Talk your way into a language: role-play on live voice,</text>
    <text x="74" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#C9BDB4">then a lesson report, vocabulary, drills and review.</text>
    <text x="74" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1.6" fill="#E8683F">OPEN SOURCE · SELF-HOSTED · RUNS WITH NO API KEY</text>

    <!-- A conversation -->
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <g transform="translate(790 70)">
        <rect width="330" height="64" rx="18" fill="#2A1F19"/>
        <text x="20" y="28" font-size="19" font-weight="600" fill="#F7F1EC">¿Qué te gustaría pedir?</text>
        <text x="20" y="50" font-size="15" fill="#A8998F">(What would you like to order?)</text>
      </g>
      <g transform="translate(930 154)">
        <rect width="270" height="48" rx="18" fill="#E8683F"/>
        <text x="20" y="31" font-size="19" font-weight="600" fill="#14100E">Quiero una sopa, por favor.</text>
      </g>
      <g transform="translate(790 222)">
        <rect width="360" height="64" rx="18" fill="#2A1F19"/>
        <text x="20" y="28" font-size="19" font-weight="600" fill="#F7F1EC">¡Perfecto! ¿Algo para beber?</text>
        <text x="20" y="50" font-size="15" fill="#A8998F">(Perfect! Anything to drink?)</text>
      </g>
    </g>
  </g>
</svg>
